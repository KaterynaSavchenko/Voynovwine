<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOYNOV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;family=Montserrat:wght@400;500;600&amp;family=Pinyon+Script&amp;family=Marck+Script&amp;display=swap">
<style>
/* Layout: full-bleed bands with 1280px inner columns; brand palette is fixed (single look, set explicitly). */
:root { --paper: #F3EDE1; --ink: #1F2E24; --night: #121A15; color-scheme: light }
html { scroll-behavior: smooth }
body { background: var(--paper); color: var(--ink) }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto } }
:focus-visible { outline: 2px solid #C08A4A; outline-offset: 3px }
img { max-width: 100% }

body{margin:0;background:#F3EDE1}
a{color:#1F2E24}a:hover{color:#121A15}
.bottle-stage{perspective:1400px}
.bottle{transform-style:preserve-3d}
.spinA{animation:spinA .8s cubic-bezier(.5,0,.3,1)}
.spinB{animation:spinB .8s cubic-bezier(.5,0,.3,1)}
@keyframes spinA{0%{transform:rotateY(0)}49.9%{transform:rotateY(90deg)}50%{transform:rotateY(-90deg)}100%{transform:rotateY(0)}}
@keyframes spinB{0%{transform:rotateY(0)}49.9%{transform:rotateY(90deg)}50%{transform:rotateY(-90deg)}100%{transform:rotateY(0)}}
.fadeX{animation:fadeA .8s ease}
.fadeY{animation:fadeB .8s ease}
@keyframes fadeB{0%,45%{opacity:1}50%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes fadeA{0%,45%{opacity:1}50%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.spinA,.spinB,.fadeX,.fadeY{animation:none}}
.float-bottle{transition: transform .12s linear}
.float-bottle:hover img{filter: drop-shadow(0 10px 14px rgba(18,26,21,.45)) brightness(1.08)}
@media (prefers-reduced-motion: reduce){.float-bottle{transition:none}}

</style>
</head>
<body>
<style>body{margin:0;font-family:system-ui,sans-serif}</style>



<div class="voy-root" x-data="voy" style="font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; color: #1F2E24; background: #F3EDE1; width: 100%">
<a href="#top" class="float-bottle" :aria-label="`${v.t.toTop}`" id="floatBottle" style="position: fixed; right: 28px; bottom: 28px; z-index: 50; display: block; width: 44px; height: 166px; transform-origin: 50% 55%">
<img src="img/bottle-mini.png" alt="" style="display: block; width: 44px; height: auto; filter: drop-shadow(0 8px 10px rgba(18,26,21,.35))">
</a>

<!-- HERO: full-bleed photo with nav on top -->
<section id="top" style="position: relative; height: 760px; background: #2A3A2E; color: #F6F1E7; display: flex; flex-direction: column; overflow: hidden">
<img src="img/hero-cellar.jpg" :alt="`${v.t.aHero}`" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 55%">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(18,26,21,0.42)"></div>
<header style="position: relative; border-bottom: 1px solid rgba(246,241,231,0.25)">
<div style="max-width: 1280px; margin: 0 auto; padding: 22px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="#top" style="font-family: 'Playfair Display', Georgia, serif; font-size: 23px; font-weight: 600; letter-spacing: 0.2em; color: #F6F1E7; text-decoration: none">VOYNOV</a>
<nav style="display: flex; flex-wrap: wrap; gap: 32px; font-size: 14px; letter-spacing: 0.06em">
<a href="#wines" style="color: #F6F1E7; text-decoration: none"><span x-text="v.t.k0"></span></a>
<a href="#story" style="color: #F6F1E7; text-decoration: none"><span x-text="v.t.k1"></span></a>
<a href="#cellar" style="color: #F6F1E7; text-decoration: none"><span x-text="v.t.k2"></span></a>
<a href="#visit" style="color: #F6F1E7; text-decoration: none"><span x-text="v.t.k3"></span></a>
<a href="#order" style="color: #F6F1E7; text-decoration: none"><span x-text="v.t.k4"></span></a>
</nav>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<div role="group" :aria-label="`${v.t.langLabel}`" style="display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid rgba(246,241,231,0.4); border-radius: 999px">
<template x-for="(l, $index) in v.langs" :key="$index"><div style="display: contents">
<template x-if="l.active"><div style="display: contents">
<button type="button" @click="l.pick()" aria-pressed="true" :lang="`${l.code}`" style="min-height: 36px; min-width: 50px; padding: 0 12px; border: 0; border-radius: 999px; background: #F6F1E7; color: #121A15; font: 600 12px Montserrat, Arial, sans-serif; letter-spacing: 0.12em; cursor: pointer"><span x-text="l.label"></span></button>
</div></template>
<template x-if="l.idle"><div style="display: contents">
<button type="button" @click="l.pick()" aria-pressed="false" :lang="`${l.code}`" style="min-height: 36px; min-width: 50px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: #F6F1E7; font: 600 12px Montserrat, Arial, sans-serif; letter-spacing: 0.12em; cursor: pointer"><span x-text="l.label"></span></button>
</div></template>
</div></template>
</div>
<a href="#order" style="border: 1px solid #F6F1E7; color: #F6F1E7; text-decoration: none; padding: 11px 20px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase"><span x-text="v.t.k5"></span></a>
</div>
</div>
</header>
<div style="position: relative; flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 22px; padding: 0 24px">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; color: #E4E0CC"><span x-text="v.t.k6"></span></p>
<h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: clamp(56px, 7.9vw, 113px); letter-spacing: 0.12em; line-height: 1">VOYNOV</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; max-width: 540px; color: #F6F1E7"><span x-text="v.t.k7"></span></p>
<a href="#wines" style="margin-top: 8px; border: 1px solid #F6F1E7; color: #F6F1E7; text-decoration: none; padding: 15px 30px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase"><span x-text="v.t.k8"></span></a>
</div>
</section>

<!-- WINES: interactive showcase -->
<section id="wines" style="padding: 104px 0 0">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 32px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #5A5F52"><span x-text="v.t.k9"></span></p>
<h2 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 46px; line-height: 1.05"><span x-text="v.t.k10"></span></h2>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">

</div></template>
</div></template>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: stretch; min-height: 760px">
<!-- left: rings + bottle on beige -->
<div style="flex: 1 1 560px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 40px; padding: 40px 32px; box-sizing: border-box; background: #ECE1D6">
<div :class="`${v.w.spin}`" style="display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div :style="`width: 132px; height: 132px; border-radius: 50%; background: conic-gradient(#1F2E24 ${v.w.gradeDeg}deg, #DDD6C7 0deg); display: flex; align-items: center; justify-content: center`">
<div style="width: 126px; height: 126px; border-radius: 50%; background: #ECE1D6; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 33px; color: #1F2E24">100%</div>
</div>
<span style="font-size: 15px; color: #3B4136"><span x-text="v.w.grape"></span></span>
</div><div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div :style="`width: 132px; height: 132px; border-radius: 50%; background: conic-gradient(#1F2E24 ${v.w.sweetDeg}deg, #DDD6C7 0deg); display: flex; align-items: center; justify-content: center`">
<div style="width: 126px; height: 126px; border-radius: 50%; background: #ECE1D6; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 21px; line-height: 1.1; text-align: center; padding: 0 12px; box-sizing: border-box; color: #1F2E24"><span x-text="v.w.sweetTxt"></span></div>
</div>
<span style="font-size: 15px; color: #3B4136"><span x-text="v.t.k11"></span></span>
</div><div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div :style="`width: 132px; height: 132px; border-radius: 50%; background: conic-gradient(#1F2E24 ${v.w.bodyDeg}deg, #DDD6C7 0deg); display: flex; align-items: center; justify-content: center`">
<div style="width: 126px; height: 126px; border-radius: 50%; background: #ECE1D6; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 21px; line-height: 1.1; text-align: center; padding: 0 12px; box-sizing: border-box; color: #1F2E24"><span x-text="v.w.bodyTxt"></span></div>
</div>
<span style="font-size: 15px; color: #3B4136"><span x-text="v.t.k12"></span></span>
</div>
</div>
<div class="bottle-stage" style="display: flex; justify-content: center">
<div :class="`bottle ${v.spin}`" style="display: flex; justify-content: center">
<img :src="`${v.w.img}`" :alt="`${v.t.aBottlePre} ${v.w.name}, ${v.w.type}`" style="display: block; height: 580px; width: auto; filter: drop-shadow(0 30px 28px rgba(18,26,21,0.35))">
</div>
<template x-for="(u, $index) in v.preload" :key="$index"><div style="display: contents"><img :src="`${u}`" alt="" style="display: none"></div></template>
</div>
</div>

<!-- right: dark info panel over garden -->
<div style="flex: 1 1 480px; min-width: 0; position: relative; overflow: hidden; color: #F6F1E7; background: #121A15">
<img src="img/garden.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 40%">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(12,18,14,0.78)"></div>
<div :class="`${v.w.spin}`" style="position: relative; padding: 72px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; max-width: 560px">
<span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 26px; letter-spacing: 0.24em; color: #DDE0CB">VOYNOV</span>
<h3 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 42px; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.04em"><span x-text="v.w.name"></span><br><span x-text="v.w.type"></span></h3>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #E4E0CC"><span x-text="v.w.taste"></span></p>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #E4E0CC"><strong style="color: #F6F1E7"><span x-text="v.t.k13"></span></strong> <span x-text="v.w.pair"></span></p>
<div style="display: flex; flex-wrap: wrap; gap: 36px; margin-top: 8px">
<div style="display: flex; align-items: center; gap: 14px">
<svg width="26" height="44" viewBox="0 0 26 44" fill="none" stroke="#DDE0CB" stroke-width="1.6" aria-hidden="true"><path d="M9 4a4 4 0 0 1 8 0v24a8 8 0 1 1-8 0z"></path><circle cx="13" cy="34" r="3"></circle><path d="M13 31V14"></path></svg>
<div style="display: flex; flex-direction: column"><span style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 30px; line-height: 1"><span x-text="v.w.temp"></span></span><span style="font-size: 13px; color: #C9CDB4"><span x-text="v.t.k14"></span></span></div>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="28" height="44" viewBox="0 0 28 44" fill="none" stroke="#DDE0CB" stroke-width="1.6" aria-hidden="true"><path d="M4 3h20c1 10-2 18-10 18S3 13 4 3z"></path><path d="M14 21v18M7 41h14"></path></svg>
<div style="display: flex; flex-direction: column"><span style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 30px; line-height: 1"><span x-text="v.w.alc"></span></span><span style="font-size: 13px; color: #C9CDB4"><span x-text="v.t.k15"></span></span></div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 12px; padding-top: 24px; border-top: 1px solid rgba(221,224,203,0.3)">

<button type="button" @click="v.prev()" :aria-label="`${v.t.aPrev}`" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #DDE0CB; background: transparent; color: #F6F1E7; font-size: 18px; cursor: pointer">←</button>
<button type="button" @click="v.next()" style="min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: #F6F1E7; color: #1F2E24; font: 600 14px Montserrat, Arial, sans-serif; cursor: pointer"><span x-text="v.t.k17"></span></button>
</div>
</div>
</div>
</div>
</section>

<!-- STORY -->
<section id="story" style="max-width: 1280px; margin: 0 auto; padding: 120px 32px; display: flex; flex-wrap: wrap; gap: 64px; align-items: center">
<div style="flex: 1 1 520px; min-width: 0; height: 600px; background: #F3EDE1; overflow: hidden; position: relative">
<img src="img/volodymyr.jpg" :alt="`${v.t.aPortrait}`" style="width: 100%; height: 100%; object-fit: cover; object-position: center 25%">
</div>
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<h2 style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #1F2E24; font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 42px"><span x-text="v.t.k18"></span></h2>
<p style="margin: 0; font-size: 17px; line-height: 1.75; color: #3B4136"><span x-text="v.t.k19"></span></p>
<p style="margin: 0; font-size: 17px; line-height: 1.75; color: #3B4136"><span x-text="v.t.k20"></span></p>
<a href="#visit" style="align-self: flex-start; background: #1F2E24; color: #F6F1E7; text-decoration: none; padding: 15px 28px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase"><span x-text="v.t.k21"></span></a>
</div>
</section>

<!-- BIG 50 + BOTTLE -->
<section style="position: relative; padding: 40px 24px 120px; overflow: hidden">
<p style="margin: 0 0 24px; text-align: center; font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; color: #5A5F52"><span x-text="v.t.k22"></span></p>
<div style="display: flex; align-items: center; justify-content: center; gap: 0">
<span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: clamp(141px, 22.9vw, 334px); line-height: 0.8; color: #1F2E24">5</span>
<img src="img/bottle.png" :alt="`${v.t.aBottle50}`" style="position: relative; z-index: 1; display: block; height: 620px; width: auto; margin: 0 -10px; filter: drop-shadow(0 34px 36px rgba(18,26,21,0.38))">
<span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: clamp(141px, 22.9vw, 334px); line-height: 0.8; color: #1F2E24">0</span>
</div>
<p style="margin: 36px auto 0; max-width: 520px; text-align: center; font-family: 'Pinyon Script', 'Marck Script', cursive; font-size: 34px; color: #3E4A33"><span x-text="v.t.k23"></span></p>
</section>

<!-- PROCESS on dark green -->
<section :style="`background: ${v.accent}; color: #F6F1E7`">

<h3 style="margin: 0; font-size: 18px; font-weight: 600"><span x-text="s.title"></span></h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #D9D6C3"><span x-text="s.text"></span></p>

</div></template>
</div>
</div>
</section>

<!-- OFFSET BLOCKS -->
<section id="cellar" style="max-width: 1140px; margin: 0 auto; padding: 120px 32px 0">
<div style="position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 0">
<div style="position: absolute; top: 60px; bottom: -60px; left: 0; width: 62%; background: #E7E0CE"></div>
<div style="position: relative; flex: 1 1 400px; min-width: 0; padding: 120px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #5A5F52"><span x-text="v.t.k2"></span></p>
<h2 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 39px"><span x-text="v.t.k25"></span></h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #3B4136"><span x-text="v.t.k26"></span></p>
<a href="#wines" style="font-size: 14px; font-weight: 600; color: #1F2E24"><span x-text="v.t.k27"></span></a>
</div>
<div style="position: relative; flex: 1 1 420px; min-width: 0; height: 440px; overflow: hidden"><img src="img/vineyard-table.jpg" :alt="`${v.t.k28}`" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: 30% center"></div>
</div>
</section>

<section id="visit" style="max-width: 1140px; margin: 0 auto; padding: 180px 32px 0">
<div style="position: relative; display: flex; flex-wrap: wrap-reverse; align-items: center; gap: 0">
<div style="position: absolute; top: 60px; bottom: -60px; right: 0; width: 62%; background: #DDE0CB"></div>
<div style="position: relative; flex: 1 1 420px; min-width: 0; height: 440px; overflow: hidden"><img src="img/three-bottles.jpg" :alt="`${v.t.k29}`" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 55%"></div>
<div style="position: relative; flex: 1 1 400px; min-width: 0; padding: 120px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

</div>
</section>

<!-- TESTIMONIAL -->
<section style="max-width: 1280px; margin: 0 auto; padding: 180px 32px 120px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
<div style="flex: 1 1 520px; min-width: 0; height: 400px; overflow: hidden"><img src="img/glass.jpg" :alt="`${v.t.k34}`" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 55%"></div>
<figure style="flex: 1 1 420px; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 22px">
<h2 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 39px"><span x-text="v.t.k35"></span></h2>
<span style="font-family: 'Playfair Display', Georgia, serif; font-size: 63px; line-height: 0.5; color: #7D8460" aria-hidden="true">“</span>
